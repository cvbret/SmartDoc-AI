services:
  postgres:
    image: postgres:17
    container_name: smartdoc-postgres
    restart: unless-stopped
    env_file:
      - .env.compose
    ports:
      - "5433:5432"
    volumes:
      - smartdoc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: smartdoc-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartdoc-backend
    restart: unless-stopped
    env_file:
      - .env.compose
      - ./backend/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    ports:
      - "8000:8000"
    volumes:
      - ./backend/chroma:/app/chroma
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -c
      - >-
        export DATABASE_URL="postgresql+psycopg2://$${POSTGRES_USER}:$${POSTGRES_PASSWORD}@postgres:5432/$${POSTGRES_DB}" &&
        python -m alembic upgrade head &&
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000

volumes:
  smartdoc_postgres_data:
    external: true
    name: smartdoc_postgres_data
  
