name: Backend CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      TEST_DATABASE_URL: postgresql+psycopg2://smartdoc_user:smartdoc_ci_password@localhost:5432/smartdoc_test
      DATABASE_URL: postgresql+psycopg2://smartdoc_user:smartdoc_ci_password@localhost:5432/smartdoc_test
      DEEPSEEK_API_KEY: ci-test-placeholder

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: smartdoc_user
          POSTGRES_PASSWORD: smartdoc_ci_password
          POSTGRES_DB: smartdoc_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U smartdoc_user -d smartdoc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Apply database migrations
        run: python -m alembic upgrade head

      - name: Run tests
        run: python -m pytest
